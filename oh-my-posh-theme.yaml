# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

palette:
    failure: '#FF5370'
    git-ahead: '#6EFFFF'
    git-ahead-behind: '#C0CFFF'
    git-behind: '#FFA06D'
    git-normal: '#66FFA6'
    git-staging: '#FFD740'
    git-staging-working: '#FFB2FF'
    git-upstream-gone: '#FF867F'
    git-working: '#84FFFF'
    default-foreground: '#FFFFFF'
    shell-foreground: p:default-foreground
    shell-background: '#0077c2'
secondary_prompt:
    template: ' '
    foreground: p:default-foreground
    background: transparent
transient_prompt:
    template: '{{ now | date "2006-01-02 03:04:05pm" }}  '
upgrade:
    source: cdn
    interval: 168h
    auto: false
    notice: false
blocks:
    - type: prompt
      alignment: left
      segments:
        - leading_diamond: ╭─
          template: ' {{ .Name }} '
          foreground: p:shell-foreground
          background: p:shell-background
          type: shell
          style: diamond
        - template: '<parentBackground></>  '
          foreground: '#FFFB38'
          background: '#ef5350'
          type: root
          style: powerline
        - options:
            folder_icon: '  '
            home_icon: 󰋜
            style: folder
          template: '  {{ .Path }} '
          foreground: '#2d3436'
          powerline_symbol: 
          background: '#FF9248'
          type: path
          style: powerline
        - options:
            fetch_status: true
            fetch_upstream_icon: true
            branch_icon: ''
            branch_identical_icon: '󱓏'
            branch_ahead_icon: '󱓊'
            branch_behind_icon: '󱓋'
            branch_gone_icon: '󱓌'
            merge_icon: ''
            no_commits_icon: '󱉍'
          template: ' {{ url .UpstreamIcon .UpstreamURL }} {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<#ef5350>  {{ .Staging.String }}</>{{ end }} '
          foreground: '#011627'
          powerline_symbol: 
          background: p:git-normal
          type: git
          style: powerline
          background_templates:
            - '{{ if eq .UpstreamStatus.String "gone" }}p:git-upstream-gone{{ end }}'
            - '{{ if and (.Working.Changed) (.Staging.Changed) }}p:git-staging-working{{ end }}'
            - '{{ if .Staging.Changed }}p:git-staging{{ end }}'
            - '{{ if .Working.Changed }}p:git-working{{ end }}'
            - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:git-ahead-behind{{ end }}'
            - '{{ if gt .Ahead 0 }}p:git-ahead{{ end }}'
            - '{{ if gt .Behind 0 }}p:git-behind{{ end }}'
        - trailing_diamond: 
          template: ' 󰔛 {{ .FormattedMs }} '
          foreground: '#ffffff'
          background: '#83769c'
          type: executiontime
          style: diamond
    - type: prompt
      alignment: right
      segments:
        - options:
            fetch_package_manager: true
            npm_icon: ' <#cc3a3a></> '
            yarn_icon: ' <#348cba></>'
            pnpm_icon: ' <#eba400></>'
          leading_powerline_symbol: 
          powerline_symbol: 
          template: 󰎙 {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}
          foreground: '#3C873A'
          background: '#303030'
          type: node
          style: powerline
        - leading_powerline_symbol: 
          powerline_symbol: 
          template:  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}
          foreground: '#FFE873'
          background: '#306998'
          type: python
          style: powerline
        - leading_powerline_symbol: 
          powerline_symbol: 
          template:  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
          foreground: '#ffffff'
          background: '#0e8ac8'
          type: java
          style: powerline
        - leading_powerline_symbol: 
          powerline_symbol: 
          template:  {{ if .Unsupported }}{{ else }}{{ .Full }}{{ end }}
          foreground: '#0d6da8'
          background: '#0e0e0e'
          type: dotnet
          style: powerline
        - leading_powerline_symbol: 
          powerline_symbol: 
          template:  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
          foreground: '#06aad5'
          background: '#ffffff'
          type: go
          style: powerline
        - leading_powerline_symbol: 
          powerline_symbol: 
          template:  {{.Profile}}{{if .Region}}@{{.Region}}{{end}}
          foreground: '#faa029'
          background: '#565656'
          type: aws
          style: powerline
        - options:
            linux: 
            macos: 
            windows: 
          leading_powerline_symbol: 
          powerline_symbol: 
          template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
          foreground: '#222222'
          background: '#b2bec3'
          type: os
          style: powerline
        - options:
            charged_icon: ' '
            not_charging_icon: ' '
            charging_icon: ' '
            discharging_icon: ' '
          template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} '
          foreground: '#262626'
          trailing_diamond: 
          background: '#f36943'
          type: battery
          style: diamond
          background_templates:
            - '{{if eq "Charging" .State.String}}#b8e994{{end}}'
            - '{{if eq "Discharging" .State.String}}#fff34e{{end}}'
            - '{{if eq "Full" .State.String}}#33DD2D{{end}}'
    - type: prompt
      alignment: left
      segments:
        - template: ╰─
          foreground: p:shell-background
          type: text
          style: plain
        - options:
            always_enabled: true
          template: ' '
          foreground: p:shell-background
          type: status
          style: plain
          foreground_templates:
            - '{{ if gt .Code 0 }}p:failure{{ end }}'
      newline: true
version: 3
